# AIModel CR for Multi-Model 3x8B on Blackwell (Staging)
#
# TRUE MULTI-MODEL SERVING: 3 x 7-8B LLM models on single RTX 6000 Blackwell GPU
# All models load in a single Triton pod with shared GPU memory.
#
# Models (each with full ensemble structure):
# - llama_ensemble (Llama 3.1 8B Instruct)
# - mistral_ensemble (Mistral 7B Instruct v0.3)
# - qwen_ensemble (Qwen2 7B Instruct)
#
# VRAM Allocation:
# - Total VRAM: 96 GB
# - Engine memory: ~43 GB (3 models)
# - KV cache: 0.28 fraction per model (total ~0.84)
#
# Inference endpoints:
# - /v2/models/llama_ensemble/infer
# - /v2/models/mistral_ensemble/infer
# - /v2/models/qwen_ensemble/infer
#
apiVersion: aimodel.ai-aas.io/v1alpha1
kind: AIModel
metadata:
  name: multi-model-3x8b-blackwell
  namespace: staging
  labels:
    app: triton-inference
    model: multi-model-3x8b
    runtime: triton-blackwell
    environment: staging
    gpu: rtx6000-blackwell
spec:
  modelName: multi-model-3x8b-blackwell
  modelID: multi-model/3x8b
  externalName: multi-model-3x8b-blackwell
  displayName: "Multi-Model 3x8B (Blackwell)"
  description: "3 x 7-8B LLM models on single RTX 6000 Blackwell GPU"
  s3Bucket: ai-aas
  s3Key: models/blackwell/multi-model-3x8b-combined
  enabled: true
  runtime: triton
  runtimeName: kserve-triton-blackwell
  modelType: text
  minReplicas: 1
  maxReplicas: 1
  deployment:
    deploymentMode: RawDeployment
  resources:
    requests:
      cpu: "8"
      memory: "64Gi"
      nvidia.com/gpu: "1"
    limits:
      cpu: "16"
      memory: "96Gi"
      nvidia.com/gpu: "1"
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
    - key: gpu-workload
      operator: Equal
      value: "true"
      effect: NoSchedule
  nodeSelector:
    node.kubernetes.io/instance-type: g3-gpu-rtxpro6000-blackwell-1
  probeConfig:
    livenessPath: /v2/health/live
    readinessPath: /v2/health/ready
    startupProbeSeconds: 900
