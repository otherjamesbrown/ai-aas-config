# AIModel CR for Multi-Model 3x8B on Blackwell (Staging)
#
# Deploys 3 x 7-8B LLM models on a single RTX 6000 Blackwell GPU using Triton
# multi-model serving with explicit model loading.
#
# Models:
# 1. Llama 3.1 8B Instruct (meta-llama/Llama-3.1-8B-Instruct)
# 2. Mistral 7B Instruct v0.3 (mistralai/Mistral-7B-Instruct-v0.3)
# 3. Qwen2 7B Instruct (Qwen/Qwen2-7B-Instruct)
#
# PREREQUISITES:
# - TensorRT-LLM engines compiled on Blackwell (sm_120)
# - S3 path: s3://ai-aas/models/blackwell/multi-model-3x8b/
# - Container: 25.06+ (required for Blackwell support)
# - Triton model repository structure with config.pbtxt files
# - KV cache allocation: 0.28 per model (total 0.84)
#
#
apiVersion: aimodel.ai-aas.io/v1alpha1
kind: AIModel
metadata:
  name: multi-model-3x8b-blackwell
  namespace: staging
  labels:
    app: triton-inference
    model: multi-model-3x8b
    runtime: triton-blackwell
    environment: staging
    gpu: rtx6000-blackwell
spec:
  modelName: multi-model-3x8b-blackwell
  modelID: multi-model/3x8b  # Composite model identifier
  externalName: multi-model-3x8b-blackwell
  displayName: "Multi-Model 3x8B (Blackwell)"
  description: "3 x 7-8B LLM models on single RTX 6000 Blackwell GPU"
  s3Bucket: ai-aas
  s3Key: models/blackwell/multi-model-3x8b
  enabled: true
  runtime: triton
  runtimeName: kserve-triton-blackwell
  modelType: text
  minReplicas: 1
  maxReplicas: 1

  # RawDeployment mode required for GPU workloads
  deployment:
    deploymentMode: RawDeployment

  # Multi-model configuration
  # Triton will load all 3 models explicitly with model-control-mode=explicit
  multiModel:
    enabled: true
    models:
      - name: llama-3.1-8b-instruct
        modelID: meta-llama/Llama-3.1-8B-Instruct
        kvCacheFraction: "0.28"
        maxBatchSize: 32
      - name: mistral-7b-instruct
        modelID: mistralai/Mistral-7B-Instruct-v0.3
        kvCacheFraction: "0.28"
        maxBatchSize: 32
      - name: qwen2-7b-instruct
        modelID: Qwen/Qwen2-7B-Instruct
        kvCacheFraction: "0.28"
        maxBatchSize: 32

  resources:
    requests:
      cpu: "16"
      memory: "64Gi"
      nvidia.com/gpu: "1"
    limits:
      cpu: "32"
      memory: "96Gi"
      nvidia.com/gpu: "1"

  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
    - key: gpu-workload
      operator: Equal
      value: "true"
      effect: NoSchedule

  nodeSelector:
    # Target RTX PRO 6000 Blackwell nodes specifically
    node.kubernetes.io/instance-type: g3-gpu-rtxpro6000-blackwell-1

  probeConfig:
    livenessPath: /v2/health/live
    readinessPath: /v2/health/ready
    startupProbeSeconds: 900  # Longer startup for 3 models loading
