# Multi-Model Deployment: 3x 7-8B models on Blackwell RTX PRO 6000
# Triton TensorRT-LLM with full ensemble structure
# Each model has its own AIModel CR and InferenceService
#
# Models:
# 1. Llama 3.1 8B Instruct (meta-llama/Llama-3.1-8B-Instruct)
# 2. Mistral 7B Instruct v0.3 (mistralai/Mistral-7B-Instruct-v0.3)
# 3. Qwen2 7B Instruct (Qwen/Qwen2-7B-Instruct)
#
# Total VRAM Usage:
# - Llama 3.1 8B: ~15 GB engine + ~23 GB KV cache = 38 GB
# - Mistral 7B: ~14 GB engine + ~23 GB KV cache = 37 GB
# - Qwen2 7B: ~14 GB engine + ~24 GB KV cache = 38 GB
# - Total: ~43 GB engines + ~70 GB KV cache = 113 GB (exceeds 96 GB!)
#
# NOTE: Currently disabled. Need to adjust KV cache fractions or deploy models separately.
# Each model: KV cache fraction 0.28, max batch size 32
#
---
# Llama 3.1 8B Instruct
apiVersion: aimodel.ai-aas.io/v1alpha1
kind: AIModel
metadata:
  name: llama-3-1-8b-instruct-triton-blackwell
  namespace: staging
  labels:
    app: triton-inference
    runtime: triton-blackwell
    multi-model: "3x8b"
spec:
  modelName: llama-3-1-8b-instruct-triton-blackwell
  modelID: meta-llama/Llama-3.1-8B-Instruct
  s3Bucket: ai-aas
  s3Key: models/blackwell/multi-model-3x8b/llama-3.1-8b-instruct
  enabled: true
  runtime: triton
  runtimeName: kserve-triton-blackwell
  minReplicas: 1
  maxReplicas: 1
  resources:
    requests:
      cpu: "4"
      memory: "16Gi"
      nvidia.com/gpu: "1"
    limits:
      cpu: "8"
      memory: "32Gi"
      nvidia.com/gpu: "1"
  nodeSelector:
    node.kubernetes.io/instance-type: g3-gpu-rtxpro6000-blackwell-1
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule

---
