# AIModel CR for Llama 3.1 8B Instruct (TensorRT-LLM) - Staging (RTX 4000 Ada)
#
# TensorRT-LLM deployment on RTX 4000 Ada GPU.
# Uses pre-compiled TRT-LLM engines for Ada architecture (compute 8.9).
#
# PREREQUISITES:
# - TensorRT-LLM engines compiled for RTX 4000 Ada uploaded to S3
# - S3 path: s3://ai-aas-models/triton/llama-3.1-8b-instruct-trtllm/
# - ClusterServingRuntime kserve-tensorrt-llm must be deployed
#
apiVersion: aimodel.ai-aas.io/v1alpha1
kind: AIModel
metadata:
  name: llama-3-1-8b-instruct-trtllm-ada
  namespace: staging
  labels:
    app: triton-inference
    model: llama-3.1-8b-instruct
    runtime: tensorrt-llm
    environment: staging
    gpu: rtx4000-ada
spec:
  modelName: llama-3-1-8b-instruct-trtllm-ada
  modelID: meta-llama/Llama-3.1-8B-Instruct
  externalName: llama-3.1-8b-instruct-trtllm-ada
  s3Bucket: ai-aas
  s3Key: models/ada/llama-3.1-8b-instruct/trtllm-v1-fp8
  enabled: true
  runtime: tensorrt-llm
  modelType: text
  minReplicas: 1
  maxReplicas: 1
  deployment:
    deploymentMode: RawDeployment
  recipeRef:
    name: llama-3-1-8b-instruct-trtllm
    namespace: ai-model-system
  resources:
    requests:
      cpu: "8"
      memory: "32Gi"
      nvidia.com/gpu: "1"
    limits:
      cpu: "16"
      memory: "48Gi"
      nvidia.com/gpu: "1"
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
    - key: gpu-workload
      operator: Equal
      value: "true"
      effect: NoSchedule
  nodeSelector:
    # Target RTX 4000 Ada nodes specifically
    node.kubernetes.io/instance-type: g2-gpu-rtx4000a1-l
  probeConfig:
    livenessPath: /v2/health/live
    readinessPath: /v2/health/ready
    startupProbeSeconds: 600
