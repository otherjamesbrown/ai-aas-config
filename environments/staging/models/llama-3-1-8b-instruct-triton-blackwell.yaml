# AIModel CR for Llama 3.1 8B Instruct - Triton on Blackwell (Staging)
#
# Uses Triton Inference Server with TRT-LLM backend on Blackwell GPUs.
# Provides full /v2 protocol support with ensemble structure.
#
# COMPARISON:
# - llama-3-1-8b-instruct-trtllm-blackwell: trtllm-serve, OpenAI API, /v1 protocol
# - llama-3-1-8b-instruct-triton-blackwell: Triton server, v2 protocol, ensemble
#
# PREREQUISITES:
# - TensorRT-LLM engines compiled on Blackwell (sm_120)
# - S3 path: s3://ai-aas/models/blackwell/llama-3.1-8b-instruct/triton-v1/
# - Container: 25.06+ (required for Blackwell support)
# - Triton ensemble model repository structure
#
apiVersion: aimodel.ai-aas.io/v1alpha1
kind: AIModel
metadata:
  name: llama-3-1-8b-instruct-triton-blackwell
  namespace: staging
  labels:
    app: triton-inference
    model: llama-3.1-8b-instruct
    runtime: triton-blackwell
    environment: staging
    gpu: rtx6000-blackwell
spec:
  modelName: llama-3-1-8b-instruct-triton-blackwell
  modelID: meta-llama/Llama-3.1-8B-Instruct
  externalName: llama-3.1-8b-instruct-triton-blackwell
  s3Bucket: ai-aas
  s3Key: models/blackwell/llama-3.1-8b-instruct/triton-v1
  enabled: false
  runtime: triton
  runtimeName: kserve-triton-blackwell
  modelType: text
  minReplicas: 1
  maxReplicas: 1
  deployment:
    deploymentMode: RawDeployment
  resources:
    requests:
      cpu: "8"
      memory: "32Gi"
      nvidia.com/gpu: "1"
    limits:
      cpu: "16"
      memory: "48Gi"
      nvidia.com/gpu: "1"
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
    - key: gpu-workload
      operator: Equal
      value: "true"
      effect: NoSchedule
  nodeSelector:
    # Target RTX PRO 6000 Blackwell nodes specifically
    node.kubernetes.io/instance-type: g3-gpu-rtxpro6000-blackwell-1
  probeConfig:
    livenessPath: /v2/health/live
    readinessPath: /v2/health/ready
    startupProbeSeconds: 600
