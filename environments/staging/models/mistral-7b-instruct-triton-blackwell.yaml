# AIModel CR for Mistral 7B Instruct v0.3 - Triton on Blackwell (Staging)
#
# Uses Triton Inference Server with TRT-LLM backend on Blackwell GPUs.
# Full ensemble structure (preprocessing/tensorrt_llm/postprocessing/ensemble).
#
# NOTE: Only one model can use the Blackwell GPU at a time.
# Disable llama-3-1-8b-instruct-triton-blackwell before enabling this.
#
apiVersion: aimodel.ai-aas.io/v1alpha1
kind: AIModel
metadata:
  name: mistral-7b-instruct-triton-blackwell
  namespace: staging
  labels:
    app: triton-inference
    model: mistral-7b-instruct
    runtime: triton-blackwell
    environment: staging
    gpu: rtx6000-blackwell
spec:
  modelName: mistral-7b-instruct-triton-blackwell
  modelID: mistralai/Mistral-7B-Instruct-v0.3
  externalName: mistral-7b-instruct-triton-blackwell
  s3Bucket: ai-aas
  s3Key: models/blackwell/multi-model-3x8b/mistral-7b-instruct
  enabled: false
  runtime: triton
  runtimeName: kserve-triton-blackwell
  modelType: text
  minReplicas: 1
  maxReplicas: 1
  deployment:
    deploymentMode: RawDeployment
  resources:
    requests:
      cpu: "8"
      memory: "32Gi"
      nvidia.com/gpu: "1"
    limits:
      cpu: "16"
      memory: "48Gi"
      nvidia.com/gpu: "1"
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
    - key: gpu-workload
      operator: Equal
      value: "true"
      effect: NoSchedule
  nodeSelector:
    node.kubernetes.io/instance-type: g3-gpu-rtxpro6000-blackwell-1
  probeConfig:
    livenessPath: /v2/health/live
    readinessPath: /v2/health/ready
    startupProbeSeconds: 600
