# AIModel CR for openai/gpt-oss-120b (Staging)
#
# REQUIREMENTS:
# - RTX PRO 6000 Blackwell GPU (96GB VRAM) or equivalent
# - Uses OpenAI's MXFP4 quantization for efficient inference
# - Special vLLM build required (vllm==0.10.1+gptoss)
#
# SECURITY WARNING: This configuration uses trustRemoteCode
# which allows the model to execute arbitrary Python code from HuggingFace.
# Only use with trusted model sources.
apiVersion: aimodel.ai-aas.io/v1alpha1
kind: AIModel
metadata:
  name: openai-gpt-oss-120b
  namespace: staging
  labels:
    app: vllm-inference
    model: gpt-oss-120b
    provider: openai
    environment: staging
spec:
  modelName: openai-gpt-oss-120b
  modelID: openai/gpt-oss-120b
  enabled: true
  runtime: vllm
  modelType: text
  minReplicas: 1
  maxReplicas: 1
  deployment:
    deploymentMode: RawDeployment
  resources:
    requests:
      cpu: "12"
      memory: "128Gi"
      nvidia.com/gpu: "1"
    limits:
      cpu: "16"
      memory: "180Gi"
      nvidia.com/gpu: "1"
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
    - key: gpu-workload
      operator: Equal
      value: "true"
      effect: NoSchedule
  nodeSelector:
    # Target RTX PRO 6000 Blackwell nodes specifically
    node.kubernetes.io/instance-type: g3-gpu-rtxpro6000-blackwell-1
  runtimeArgs:
    - --dtype=auto
    - --max-model-len=32768
    - --gpu-memory-utilization=0.95
  probeConfig:
    # Large model needs more time to load (15 minutes)
    initialDelaySeconds: 900
  trustRemoteCode: true
