# AIModel CR for Llama 3.1 8B Instruct (TensorRT-LLM) - Development
#
# Uses TensorRT-LLM runtime via Triton Inference Server.
# References the ModelRecipe in ai-model-system namespace.
#
# PREREQUISITES:
# - TensorRT-LLM engines must be pre-compiled and uploaded to S3
# - S3 path: s3://ai-aas/models/ada/llama-3.1-8b-instruct/trtllm-v1-fp16/
# - ClusterServingRuntime kserve-tensorrt-llm must be deployed
#
apiVersion: aimodel.ai-aas.io/v1alpha1
kind: AIModel
metadata:
  name: llama-3-1-8b-instruct-trtllm
  namespace: development
  labels:
    app: triton-inference
    model: llama-3.1-8b-instruct
    runtime: tensorrt-llm
    environment: development
spec:
  modelName: llama-3-1-8b-instruct-trtllm
  modelID: meta-llama/Llama-3.1-8B-Instruct
  externalName: llama-3.1-8b-instruct
  s3Bucket: ai-aas
  s3Key: models/ada/llama-3.1-8b-instruct/trtllm-v1-fp16
  enabled: true
  runtime: tensorrt-llm
  modelType: text
  minReplicas: 1
  maxReplicas: 1
  deploymentMode: RawDeployment
  recipeRef:
    name: llama-3-1-8b-instruct-trtllm
    namespace: ai-model-system
  resources:
    requests:
      cpu: "8"
      memory: "32Gi"
      nvidia.com/gpu: "1"
    limits:
      cpu: "16"
      memory: "48Gi"
      nvidia.com/gpu: "1"
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
