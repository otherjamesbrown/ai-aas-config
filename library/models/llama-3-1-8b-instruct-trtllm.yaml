# Model Library: Llama 3.1 8B Instruct (TensorRT-LLM)
#
# Base configuration for Llama 3.1 8B with TensorRT-LLM runtime.
# Environment-specific configs should reference this and override as needed.
#
# AVAILABLE ENGINES:
#   Ada (RTX 4000 Ada, sm_89):
#     - s3Key: models/ada/llama-3.1-8b-instruct/trtllm-v1-fp8
#     - Runtime: tensorrt-llm (container 24.10, TRT-LLM 0.14.0)
#     - Quantization: FP8
#     - Engine size: 8.53 GB
#
#   Blackwell (RTX PRO 6000, sm_120):
#     - s3Key: models/blackwell/llama-3.1-8b-instruct/trtllm-v1 (TRT-LLM 0.20.0)
#     - s3Key: models/blackwell/llama-3.1-8b-instruct/trtllm-v2-021 (TRT-LLM 0.21.0)
#     - Runtime: tensorrt-llm-blackwell (container 25.06/25.08)
#     - Quantization: BF16
#     - Engine size: 15 GB
#
# KNOWN ISSUES:
#   - Blackwell: /v1/chat/completions broken in trtllm-serve (GitHub #5648)
#   - Use /v1/completions endpoint instead
#
apiVersion: aimodel.ai-aas.io/v1alpha1
kind: ModelLibraryEntry
metadata:
  name: llama-3-1-8b-instruct-trtllm
  labels:
    model-family: llama
    model-size: 8b
    task: text-generation
spec:
  # Model Identity
  modelID: meta-llama/Llama-3.1-8B-Instruct
  displayName: "Llama 3.1 8B Instruct (TensorRT-LLM)"
  description: "Meta's Llama 3.1 8B Instruct optimized with TensorRT-LLM"
  modelType: text

  # HuggingFace Source Configuration
  huggingface:
    modelId: meta-llama/Llama-3.1-8B-Instruct
    # Gated model - requires HF_TOKEN with Llama access approval
    requiresToken: true
    tokenSecretRef: hf-token  # K8s secret containing HF_TOKEN
    # Some models need this for custom code (not needed for Llama)
    trustRemoteCode: false

  # Available Variants by GPU Architecture
  variants:
    ada:
      # RTX 4000 Ada Generation (sm_89)
      gpuArchitecture: sm_89
      gpuName: "RTX 4000 Ada Generation"

      # Runtime Configuration
      runtime: tensorrt-llm
      s3Bucket: ai-aas
      s3Key: models/ada/llama-3.1-8b-instruct/trtllm-v1-fp8
      container: nvcr.io/nvidia/tritonserver:24.10-trtllm-python-py3
      trtllmVersion: "0.14.0"

      # Build Configuration - to reproduce this engine
      buildConfig:
        # Build container (must match runtime for engine compatibility)
        container: nvcr.io/nvidia/tritonserver:24.10-trtllm-python-py3
        # Container quirks
        preInstall:
          - "pip install setuptools"  # Required for modelopt in 24.10

        # TensorRT-LLM Build Parameters
        trtllm:
          maxBatchSize: 32
          maxInputLen: 4096
          maxSeqLen: 8192
          maxNumTokens: 4096

        # Quantization Configuration
        quantization:
          algorithm: FP8
          kvCacheAlgo: FP8  # FP8 KV cache for memory efficiency

        # Build API (changed between versions)
        # 24.10 uses: from tensorrt_llm.hlapi import LLM, BuildConfig, QuantConfig
        buildApi: hlapi

        # Estimated build time
        buildTime: "5-15 minutes"

        # Runbook reference
        runbook: docs/runbooks/rebuild-trtllm-fp8-ada.md

      # Engine Output Info
      engineSize: "8.53 GB"

      # Runtime Settings
      maxBatchSize: 32

      # Deployment targeting
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-RTX-4000-Ada-Generation
      resources:
        requests:
          cpu: "8"
          memory: "32Gi"
          nvidia.com/gpu: "1"
        limits:
          cpu: "16"
          memory: "48Gi"
          nvidia.com/gpu: "1"

    blackwell:
      # RTX PRO 6000 Blackwell Server Edition (sm_120)
      gpuArchitecture: sm_120
      gpuName: "RTX PRO 6000 Blackwell Server Edition"

      # Runtime Configuration
      runtime: tensorrt-llm-blackwell
      s3Bucket: ai-aas
      # Available versions:
      #   trtllm-v1: TRT-LLM 0.20.0 (container 25.06)
      #   trtllm-v2-021: TRT-LLM 0.21.0 (container 25.08)
      s3Key: models/blackwell/llama-3.1-8b-instruct/trtllm-v2-021
      container: nvcr.io/nvidia/tritonserver:25.08-trtllm-python-py3
      trtllmVersion: "0.21.0"

      # Build Configuration - to reproduce this engine
      buildConfig:
        # Build container
        container: nvcr.io/nvidia/tritonserver:25.08-trtllm-python-py3
        # No preInstall needed for 25.08

        # TensorRT-LLM Build Parameters (larger for 96GB VRAM)
        trtllm:
          maxBatchSize: 64
          maxInputLen: 8192
          maxSeqLen: 10240
          maxNumTokens: 8192

        # Quantization Configuration
        quantization:
          algorithm: BF16  # Default, no explicit quantization
          # FP8 possible but not tested on Blackwell yet

        # Build API
        # 25.08 uses: from tensorrt_llm import LLM, BuildConfig
        buildApi: llmapi

        # Estimated build time (much faster on Blackwell)
        buildTime: "~30 seconds"

        # Runbook reference
        runbook: docs/runbooks/rebuild-trtllm-blackwell.md

      # Engine Output Info
      engineSize: "15 GB"

      # Runtime Settings
      maxBatchSize: 64

      # trtllm-serve specific settings
      serveArgs:
        - "--max_batch_size=64"  # Must match engine build config

      # Deployment targeting
      nodeSelector:
        node.kubernetes.io/instance-type: g3-gpu-rtxpro6000-blackwell-1
      resources:
        requests:
          cpu: "8"
          memory: "32Gi"
          nvidia.com/gpu: "1"
        limits:
          cpu: "16"
          memory: "48Gi"
          nvidia.com/gpu: "1"

      # Known Issues
      knownIssues:
        - issue: "/v1/chat/completions broken"
          description: "trtllm-serve has async bug in chat completions handler"
          workaround: "Use /v1/completions endpoint instead"
          tracking: "https://github.com/NVIDIA/TensorRT-LLM/issues/5648"
          affectedVersions: ["0.20.0", "0.21.0"]

  # Default tolerations for GPU workloads
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
    - key: gpu-workload
      operator: Equal
      value: "true"
      effect: NoSchedule

  # Probe configuration
  probeConfig:
    livenessPath: /v2/health/live
    readinessPath: /v2/health/ready
    startupProbeSeconds: 600
