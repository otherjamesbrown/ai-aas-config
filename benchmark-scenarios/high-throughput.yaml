name: high-throughput
description: |
  Maximum throughput discovery test using rate sweep profile.
  Purpose: Find the maximum sustainable requests per second (RPS).
  Uses minimal token counts to isolate throughput from generation time.
  Sweep gradually increases rate until errors or latency degrades.
version: "1.0"

data:
  type: synthetic
  prompt_tokens: 50
  output_tokens: 20
  tokenizer: gpt2

defaults:
  profile: sweep
  rate: 1
  max_rate: 50
  rate_step: 2
  step_duration: 30
  max_seconds: 300
  request_type: chat_completions

metrics:
  primary:
    - ttft_p50_ms
    - ttft_p95_ms
    - throughput_rps
    - throughput_peak_rps
    - error_rate
    - saturation_point_rps
  thresholds:
    ttft_p95_ms: 500
    error_rate: 0.05
