name: conversational
description: |
  Multi-turn conversational workload simulating interactive chat sessions.
  Typical use cases: customer support, virtual assistants, tutoring systems.
  Moderate context from conversation history with substantial responses.
version: "1.0"

data:
  type: synthetic
  prompt_tokens: 150
  output_tokens: 100
  tokenizer: gpt2

defaults:
  profile: constant
  rate: 3
  max_seconds: 90
  request_type: chat_completions

metrics:
  primary:
    - ttft_p50_ms
    - ttft_p95_ms
    - tpot_p50_ms
    - tpot_p95_ms
    - throughput_rps
    - error_rate
    - latency_p95_ms
  thresholds:
    ttft_p95_ms: 400
    tpot_p95_ms: 60
    latency_p95_ms: 3000
    error_rate: 0.01
