name: long-context
description: |
  Maximum context window stress test for models with large context support.
  Typical use cases: book analysis, codebase understanding, research synthesis.
  Tests model behavior near context limits with substantial outputs.
version: "1.0"

data:
  type: synthetic
  prompt_tokens: 8000
  output_tokens: 500
  tokenizer: gpt2

defaults:
  profile: constant
  rate: 0.5
  max_seconds: 300
  request_type: chat_completions

metrics:
  primary:
    - ttft_p50_ms
    - ttft_p95_ms
    - tpot_p50_ms
    - tpot_p95_ms
    - throughput_rps
    - error_rate
    - latency_p95_ms
    - memory_utilization_peak
  thresholds:
    ttft_p95_ms: 8000
    tpot_p95_ms: 100
    latency_p95_ms: 60000
    error_rate: 0.05
